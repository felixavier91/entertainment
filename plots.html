<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="apple-mobile-web-app-title" content="Entertainment">
    <title>Plot Search · New Movies, Shows, Books & Music</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000000;
            color: #e6e6e6;
            min-height: 100vh;
        }

        .top {
            position: sticky;
            top: 0;
            z-index: 10;
            background: #000000;
            border-bottom: 1px solid #333;
            padding: 12px 16px;
        }

        .top-inner, .list {
            max-width: 860px;
            margin: 0 auto;
        }

        .row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* Description-only switch (on here; off takes you back to the posters) */
        .switch {
            display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none;
            color: #fff; font-size: 13px; font-weight: 600; white-space: nowrap;
        }
        .switch .track {
            width: 44px; height: 24px; border-radius: 12px; background: #3b82f6;
            position: relative; flex: none;
        }
        .switch .track::after {
            content: ''; position: absolute; top: 3px; left: 23px; width: 18px; height: 18px;
            border-radius: 50%; background: #fff;
        }
        @media (max-width: 600px) { .switch span:last-child { display: none; } }

        #q {
            flex: 1;
            min-width: 0;
            padding: 12px 14px;
            border: 2px solid #555;
            background: #2a2a2a;
            color: #ffffff;
            border-radius: 6px;
            font-size: 16px;
        }
        #q:focus { outline: none; border-color: #999; }

        .sub {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 14px;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
        }

        .types { display: flex; gap: 6px; flex-wrap: wrap; }
        .types button {
            padding: 6px 12px;
            background: #1a1a1a;
            color: #bbb;
            border: 1px solid #555;
            border-radius: 5px;
            font-size: 13px;
            cursor: pointer;
        }
        .types button.on {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
            font-weight: bold;
        }

        #count {
            color: #999;
            font-size: 12px;
            font-variant-numeric: tabular-nums;
        }

        .list { padding: 6px 16px 60px; }

        .item {
            padding: 14px 0;
            border-bottom: 1px solid #222;
        }

        .item h2 {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.3;
        }

        .item h2 span {
            font-weight: normal;
            font-size: 13px;
            color: #888;
            margin-left: 6px;
        }

        .item p {
            margin-top: 5px;
            font-size: 15px;
            line-height: 1.55;
            color: #cfcfcf;
            overflow-wrap: anywhere;
        }

        .item p.tracks {
            font-size: 13px;
            color: #999;
        }

        mark {
            background: #ffd54a;
            color: #000000;
            border-radius: 2px;
            padding: 0 1px;
        }

        .msg {
            padding: 40px 0;
            text-align: center;
            color: #888;
            font-size: 15px;
        }

        #more {
            display: none;
            width: 100%;
            margin-top: 18px;
            padding: 12px;
            background: #1a1a1a;
            color: #ffffff;
            border: 1px solid #555;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="top">
        <div class="top-inner">
            <div class="row">
                <div class="switch" id="descSwitch" role="switch" aria-checked="true" title="Turn off to go back to the posters">
                    <span class="track"></span>
                    <span>Description-only</span>
                </div>
                <input type="search" id="q" placeholder="Search plots, blurbs, track lists &amp; game descriptions… e.g. heist, time travel, &quot;small town&quot;" autocomplete="off" autofocus>
            </div>
            <div class="sub">
                <div class="types" id="types">
                    <button data-type="all" class="on">All</button>
                    <button data-type="movie">Movies</button>
                    <button data-type="tv">Shows</button>
                    <button data-type="book">Books</button>
                    <button data-type="music">Music</button>
                    <button data-type="game">Games</button>
                </div>
                <span id="count">Loading…</span>
            </div>
        </div>
    </div>

    <div class="list">
        <div id="results"></div>
        <button id="more">Show more</button>
    </div>

    <script>
        const PAGE = 100;
        const KIND = { movie: 'Movie', tv: 'Show', book: 'Book', music: 'Album', game: 'Game' };
        let items = [];
        let matches = [];
        let shown = 0;
        let terms = [];
        let type = 'all';

        const qEl = document.getElementById('q');
        const resultsEl = document.getElementById('results');
        const countEl = document.getElementById('count');
        const moreEl = document.getElementById('more');

        function esc(s) {
            return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        }

        // Words must all appear in the text; "quoted text" is matched as a phrase.
        function parseTerms(q) {
            const out = [];
            const re = /"([^"]+)"|(\S+)/g;
            let m;
            while ((m = re.exec(q.toLowerCase())) !== null) {
                const t = (m[1] || m[2]).replace(/"/g, '').trim();
                if (t) out.push(t);
            }
            return out;
        }

        function highlight(text) {
            if (!terms.length) return esc(text);
            const pattern = terms
                .slice()
                .sort((a, b) => b.length - a.length)
                .map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'))
                .join('|');
            const re = new RegExp(pattern, 'gi');
            let out = '';
            let last = 0;
            let m;
            while ((m = re.exec(text)) !== null) {
                if (m[0].length === 0) { re.lastIndex++; continue; }
                out += esc(text.slice(last, m.index)) + '<mark>' + esc(m[0]) + '</mark>';
                last = m.index + m[0].length;
            }
            return out + esc(text.slice(last));
        }

        function renderMore() {
            const slice = matches.slice(shown, shown + PAGE);
            const html = slice.map(it =>
                '<div class="item"><h2>' + esc(it.title) +
                '<span>' + (it.year || '') + ' · ' + KIND[it.type] + (it.by ? ' · ' + esc(it.by) : '') + '</span></h2>' +
                (it.plot ? '<p>' + highlight(it.plot) + '</p>' : '') +
                (it.tracks ? '<p class="tracks">Tracks: ' + highlight(it.tracks) + '</p>' : '') +
                '</div>'
            ).join('');
            resultsEl.insertAdjacentHTML('beforeend', html);
            shown += slice.length;
            moreEl.style.display = shown < matches.length ? 'block' : 'none';
        }

        function update() {
            terms = parseTerms(qEl.value);
            matches = items.filter(it =>
                (type === 'all' || it.type === type) &&
                terms.every(t => it.low.includes(t))
            );
            resultsEl.innerHTML = '';
            shown = 0;
            window.scrollTo(0, 0);

            const total = type === 'all' ? items.length : items.filter(it => it.type === type).length;
            countEl.textContent = terms.length
                ? matches.length.toLocaleString() + ' of ' + total.toLocaleString() + ' match'
                : total.toLocaleString() + ' titles';

            if (!matches.length) {
                resultsEl.innerHTML = '<div class="msg">Nothing mentions that. Try fewer or different words.</div>';
                moreEl.style.display = 'none';
                return;
            }
            renderMore();
        }

        let timer = null;
        qEl.addEventListener('input', () => {
            clearTimeout(timer);
            timer = setTimeout(update, 120);
        });

        document.getElementById('types').addEventListener('click', e => {
            const btn = e.target.closest('button');
            if (!btn) return;
            type = btn.dataset.type;
            document.querySelectorAll('#types button').forEach(b => b.classList.toggle('on', b === btn));
            update();
        });

        moreEl.addEventListener('click', renderMore);

        // Load the next batch automatically when the reader nears the bottom
        window.addEventListener('scroll', () => {
            if (shown < matches.length &&
                window.innerHeight + window.scrollY >= document.body.offsetHeight - 600) {
                renderMore();
            }
        });

        const getJson = (url, empty) => fetch(url).then(r => r.ok ? r.json() : empty).catch(() => empty);

        async function load() {
            try {
                const [data, books, music, games] = await Promise.all([
                    getJson('data.json', null),
                    getJson('books.json', { books: [] }),
                    getJson('music.json', { albums: [] }),
                    getJson('games.json', { games: [] })
                ]);
                if (!data) throw new Error('data.json missing');
                const movies = (data.movies || []).map(m => ({ ...m, type: 'movie', date: m.release_date }));
                const tv = (data.tv_shows || data.tv || []).map(t => ({ ...t, type: 'tv', date: t.first_air_date }));
                const screen = [...movies, ...tv]
                    .filter(it => (it.overview || '').trim())
                    .map(it => ({
                        title: it.title || 'Untitled', year: it.year || (it.date || '').slice(0, 4), type: it.type,
                        date: it.date || '', by: '', plot: it.overview.trim(), tracks: '',
                        low: it.overview.toLowerCase()
                    }));
                const bookItems = (books.books || [])
                    .filter(b => (b.overview || '').trim())
                    .map(b => ({
                        title: b.title, year: b.year, type: 'book', date: b.release_date || '', by: 'by ' + b.author,
                        plot: b.overview.trim(), tracks: '',
                        low: (b.overview + ' ' + b.author).toLowerCase()
                    }));
                // Albums are searchable by their notes and by track names
                const albumItems = (music.albums || [])
                    .filter(a => (a.overview || '').trim() || (a.tracks || []).length)
                    .map(a => ({
                        title: a.title, year: a.year, type: 'music', date: a.release_date || '', by: a.artist,
                        plot: (a.overview || '').trim(), tracks: (a.tracks || []).join(' · '),
                        low: ((a.overview || '') + ' ' + a.artist + ' ' + (a.tracks || []).join(' ')).toLowerCase()
                    }));
                const gameItems = (games.games || [])
                    .filter(g => (g.overview || '').trim())
                    .map(g => ({
                        title: g.title, year: g.year, type: 'game', date: g.release_date || '', by: g.developer || g.platforms || '',
                        plot: g.overview.trim(), tracks: '',
                        low: (g.overview + ' ' + (g.developer || '') + ' ' + (g.platforms || '')).toLowerCase()
                    }));
                items = [...screen, ...bookItems, ...albumItems, ...gameItems].sort((a, b) => b.date.localeCompare(a.date));
                update();
            } catch (error) {
                countEl.textContent = '';
                resultsEl.innerHTML = '<div class="msg">Could not load the data (' + esc(String(error.message)) + ').</div>';
            }
        }

        // Switch off → back to the posters, same medium, without the redirect kicking in again
        const POSTER_TYPE = { movie: 'movies', tv: 'tv', book: 'books', music: 'music', game: 'games' };
        document.getElementById('descSwitch').addEventListener('click', () => {
            try { localStorage.setItem('descOnly', '0'); } catch (e) {}
            location.href = 'index.html?posters' + (type !== 'all' ? '&type=' + POSTER_TYPE[type] : '');
        });
        
        // plots.html?q=heist opens with that search already typed in; plots.html?type=book narrows the medium
        qEl.value = new URLSearchParams(location.search).get('q') || '';
        const t0 = new URLSearchParams(location.search).get('type');
        if (t0 && KIND[t0]) { type = t0; document.querySelectorAll('#types button').forEach(b => b.classList.toggle('on', b.dataset.type === t0)); }

        load();
    </script>
</body>
</html>
