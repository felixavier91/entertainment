name: Update Data & Deploy

on:
  # Every 6 hours
  schedule:
    - cron: '0 */6 * * *'
  # Run on ANY push to main branch (including index.html changes)
  push:
    branches:
      - main
  
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests numpy fastembed
      
      # The embedding model is ~130 MB; keep it between runs
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: /tmp/fastembed_cache
          key: fastembed-bge-small-en-v1.5
      
      # Only fetch new data if triggered by schedule or manual dispatch
      # Skip data fetch if triggered by a regular push (like index.html change)
      - name: Fetch TMDB data (movies & shows)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: python fetch_data.py
      
      - name: Fetch Open Library data (books)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python fetch_books.py
      
      - name: Fetch Deezer data (music)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python fetch_music.py
      
      # RAWG's free tier is 20,000 requests a month, so games refresh once a day (the 00:00 UTC run) or on manual runs.
      # Skipped silently until the RAWG_KEY secret exists.
      - name: Fetch RAWG data (games)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          RAWG_KEY: ${{ secrets.RAWG_KEY }}
        run: |
          if [ -z "$RAWG_KEY" ]; then echo "RAWG_KEY secret not set; skipping games"; exit 0; fi
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$(date -u +%H)" != "00" ]; then echo "not the daily games run"; exit 0; fi
          python fetch_games.py
      
      # Movie themes are refreshed on the ROG (refresh_themes.sh, Ollama bge-m3). Books and music are done here.
      - name: Refresh book, music & game themes
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          FASTEMBED_CACHE_PATH: /tmp/fastembed_cache
        run: |
          for m in books music games; do
            [ -f themes_$m.json ] || [ -f centroids_$m.npy ] || { echo "no themes built for $m yet"; continue; }
            python refresh_media_themes.py $m
          done
      
      - name: Commit data changes
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data.json cache/
          for f in books.json music.json games.json themes_*.json labels_*.json embeddings_*.npy embed_ids_*.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "🔄 Data update: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash
            git push
          fi
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
