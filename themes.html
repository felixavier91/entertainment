<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Themes · New Movies, Shows, Books & Music</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000000;
            color: #e6e6e6;
            min-height: 100vh;
        }
        .top {
            position: sticky; top: 0; z-index: 10;
            background: #000000;
            border-bottom: 1px solid #333;
            padding: 12px 16px;
        }
        .top-inner, .list { max-width: 860px; margin: 0 auto; }
        .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .back { color: #999; text-decoration: none; font-size: 14px; white-space: nowrap; }
        .back:hover { color: #fff; }
        .tabs, .types, .media { display: flex; gap: 6px; flex-wrap: wrap; }
        button { font-family: inherit; }
        .tabs button, .types button, .media button, .act button, .chip, #more {
            padding: 7px 12px;
            background: #1a1a1a;
            color: #bbb;
            border: 1px solid #555;
            border-radius: 5px;
            font-size: 13px;
            cursor: pointer;
        }
        .tabs button { font-size: 15px; padding: 9px 14px; }
        .media button { border-radius: 20px; }
        .tabs button.on, .types button.on {
            background: #fff; color: #000; border-color: #fff; font-weight: bold;
        }
        .media button.on { background: #3b82f6; color: #fff; border-color: #3b82f6; font-weight: 600; }
        .sub {
            display: flex; flex-wrap: wrap; gap: 8px 14px;
            align-items: center; justify-content: space-between;
            margin-top: 10px;
        }
        #count { color: #999; font-size: 12px; }
        .list { padding: 6px 16px 60px; }
        h1 { font-size: 20px; color: #fff; margin: 16px 0 4px; line-height: 1.3; }
        .hint { color: #999; font-size: 14px; line-height: 1.5; margin: 6px 0 12px; }

        .theme {
            display: block; width: 100%; text-align: left;
            padding: 13px 0;
            background: none; border: none; border-bottom: 1px solid #222;
            color: inherit; cursor: pointer;
        }
        .theme:hover b { text-decoration: underline; }
        .theme b { font-size: 16px; color: #fff; font-weight: 600; }
        .theme .n { color: #888; font-size: 13px; margin-left: 8px; white-space: nowrap; }
        .theme .liked { color: #7ddc8a; font-size: 13px; margin-left: 8px; white-space: nowrap; }
        .theme .ex { display: block; margin-top: 4px; color: #aaa; font-size: 13.5px; line-height: 1.45; }

        .item { display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px solid #222; }
        .item img, .item .noimg {
            width: 62px; height: 93px; flex: none;
            border-radius: 4px; background: #1a1a1a; object-fit: cover;
        }
        .item img.square, .item .noimg.square { height: 62px; }
        .item .body { flex: 1; min-width: 0; }
        .item h2 { font-size: 16px; font-weight: 600; color: #fff; line-height: 1.3; }
        .item h2 span { font-weight: normal; font-size: 13px; color: #888; margin-left: 6px; white-space: nowrap; }
        .item .why { font-size: 12.5px; color: #7ddc8a; margin-top: 3px; }
        .item .where { font-size: 12.5px; color: #888; margin-top: 3px; }
        .item p { margin-top: 5px; font-size: 14.5px; line-height: 1.5; color: #cfcfcf; overflow-wrap: anywhere; }
        .act { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
        .act button.up.on { background: #1f6f33; border-color: #2f9e4a; color: #fff; }
        .act button.down.on { background: #7a2323; border-color: #b33; color: #fff; }

        #find {
            width: 100%; padding: 12px 14px;
            border: 2px solid #555; background: #2a2a2a; color: #fff;
            border-radius: 6px; font-size: 16px; margin-top: 6px;
        }
        #find:focus { outline: none; border-color: #999; }
        .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
        .chip.up { border-color: #2f9e4a; color: #cfe; }
        .chip.down { border-color: #b33; color: #fcc; }
        .msg { padding: 40px 0; text-align: center; color: #888; font-size: 15px; }
        #more { display: none; width: 100%; margin-top: 18px; padding: 12px; font-size: 14px; color: #fff; }
    </style>
</head>
<body>
    <div class="top">
        <div class="top-inner">
            <div class="row">
                <a class="back" href="index.html?posters">← Posters</a>
                <div class="media" id="media">
                    <button data-medium="movies">🎬 Movies &amp; Shows</button>
                    <button data-medium="books">📚 Books</button>
                    <button data-medium="games">🎮 Games</button>
                </div>
            </div>
            <div class="row" style="margin-top: 10px;">
                <div class="tabs">
                    <button data-go="themes" id="tab-themes">Themes</button>
                    <button data-go="me" id="tab-me">For me</button>
                </div>
            </div>
            <div class="sub">
                <div class="types" id="types"></div>
                <span id="count">Loading…</span>
            </div>
        </div>
    </div>

    <div class="list">
        <div id="head"></div>
        <div id="results"></div>
        <button id="more">Show more</button>
    </div>

    <script>
        const PAGE = 60;
        const IMG = 'https://image.tmdb.org/t/p/w154';

        // Each medium has its own data file, its own theme file (its own embedding space) and its own filters.
        const MEDIA = {
            movies: {
                data: 'data.json', themes: 'themes.json',
                types: [['all', 'All'], ['movie', 'Movies'], ['tv', 'Shows']],
                goodLabel: '★ 7+ only', goodTitle: 'Only titles rated 7 or higher',
                good: it => it.vote_average >= 7 && it.vote_count >= 50,
                // Rating that doesn't let a 9.5 with 12 votes beat an 8.3 with 10,000
                quality: it => { const v = it.vote_count || 0, m = 200; return (v / (v + m)) * (it.vote_average || 0) + (m / (v + m)) * 6.3; },
                bestFirst: 'Best rated first',
                parse(data) {
                    return [...(data.movies || []).map(m => ({ ...m, type: 'movie' })), ...(data.tv_shows || []).map(t => ({ ...t, type: 'tv' }))]
                        .map(it => ({
                            ...it, key: it.type + ':' + it.id, title: it.title || 'Untitled', plot: (it.overview || '').trim(),
                            kind: it.type === 'tv' ? 'Show' : 'Movie', score: it.vote_average ? '★ ' + it.vote_average.toFixed(1) : '',
                            img: it.poster_path ? IMG + it.poster_path : null, square: false,
                            where: (it.providers && it.providers.streaming || []).map(p => p.name).filter(n => !/channel|with ads/i.test(n)).slice(0, 3).join(', '),
                            wherePrefix: 'On ', pop: it.vote_count || 0
                        }));
                }
            },
            books: {
                data: 'books.json', themes: 'themes_books.json',
                types: [['all', 'All'], ['fiction', 'Fiction'], ['nonfiction', 'Nonfiction']],
                goodLabel: '★ 4+ only', goodTitle: 'Only books rated 4 stars or higher by at least 10 readers',
                good: it => it.rating >= 4 && it.ratings_count >= 10,
                quality: it => { const v = it.ratings_count || 0, m = 20; return (v / (v + m)) * ((it.rating || 0) * 2) + (m / (v + m)) * 7.6; },
                bestFirst: 'Best rated first',
                parse(data) {
                    return (data.books || []).map(b => ({
                        ...b, key: 'book:' + b.id, plot: (b.overview || '').trim(),
                        kind: b.type === 'nonfiction' ? 'Nonfiction' : 'Fiction', score: b.rating ? '★ ' + b.rating.toFixed(1) : '',
                        img: b.cover_id ? 'https://covers.openlibrary.org/b/id/' + b.cover_id + '-M.jpg' : null, square: false,
                        where: b.author + (b.ebook === 'public' ? ' · free to read' : b.ebook === 'borrowable' ? ' · borrowable' : ''),
                        wherePrefix: 'By ', pop: b.readers || 0
                    }));
                }
            },
            music: {
                data: 'music.json', themes: 'themes_music.json',
                types: [['all', 'All'], ['album', 'Albums'], ['ep', 'EPs']],
                goodLabel: '❤️ 10k+ fans', goodTitle: 'Only releases with at least 10,000 Deezer fans',
                good: it => it.fans >= 10000,
                quality: it => Math.log10((it.fans || 0) + 1) * 1.5,
                bestFirst: 'Most fans first',
                parse(data) {
                    return (data.albums || []).map(a => ({
                        ...a, key: 'music:' + a.id, plot: (a.overview || '').trim() || ('Tracks: ' + (a.tracks || []).slice(0, 10).join(' · ')),
                        kind: a.type === 'ep' ? 'EP' : 'Album', score: a.fans ? '❤️ ' + (a.fans >= 1000 ? Math.round(a.fans / 1000) + 'k' : a.fans) : '',
                        img: a.cover ? a.cover.replace('1000x1000', '250x250') : null, square: true,
                        where: a.artist + (a.label ? ' · ' + a.label : ''),
                        wherePrefix: '', pop: a.fans || 0
                    }));
                }
            },
            games: {
                data: 'games.json', themes: 'themes_games.json',
                types: [['all', 'All'], ['pc', 'PC'], ['playstation', 'PlayStation'], ['xbox', 'Xbox'], ['nintendo', 'Nintendo']],
                goodLabel: 'Metacritic 75+', goodTitle: 'Only games with a Metacritic score of 75 or higher',
                good: it => it.metacritic >= 75,
                quality: it => it.metacritic ? it.metacritic / 10 : (it.rating ? it.rating * 2 : 5),
                bestFirst: 'Best reviewed first',
                parse(data) {
                    return (data.games || []).map(g => ({
                        ...g, key: 'game:' + g.id, plot: (g.overview || '').trim(), type: g.family || 'other',
                        kind: 'Game', score: g.metacritic ? 'MC ' + g.metacritic : (g.rating ? '★ ' + g.rating.toFixed(1) : ''),
                        img: g.image || null, square: true,
                        where: (g.developer || '') + (g.platforms ? ' · ' + g.platforms : ''),
                        wherePrefix: '', pop: g.added || 0
                    }));
                }
            }
        };

        let medium = 'movies';
        const loaded = {};           // medium → { items, byKey, themes, dim, vec }
        let items = [], byKey = {}, themes = [], dim = 0, vec = null;
        let type = 'all', good = false;
        let list = [], shown = 0, whyFor = null;

        const headEl = document.getElementById('head');
        const resultsEl = document.getElementById('results');
        const countEl = document.getElementById('count');
        const moreEl = document.getElementById('more');

        // ---- taste: what you marked, kept in this browser only (keys are prefixed, so media never collide) ----
        let taste = {};
        try { taste = JSON.parse(localStorage.getItem('taste') || '{}'); } catch (e) {}
        function saveTaste() { try { localStorage.setItem('taste', JSON.stringify(taste)); } catch (e) {} }
        const liked = () => items.filter(it => taste[it.key] === 1);
        const disliked = () => items.filter(it => taste[it.key] === -1);

        function esc(s) {
            return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        }
        function sim(a, b) {
            let s = 0; const x = a * dim, y = b * dim;
            for (let i = 0; i < dim; i++) s += vec[x + i] * vec[y + i];
            return s;
        }
        const M = () => MEDIA[medium];
        const quality = it => M().quality(it);
        const pass = it => (type === 'all' || it.type === type || (it.families && it.families.includes(type))) && (!good || M().good(it));

        function itemHtml(it) {
            const t = taste[it.key] || 0;
            const why = whyFor && whyFor[it.key];
            const sq = it.square ? ' square' : '';
            return '<div class="item" data-key="' + it.key + '">' +
                (it.img ? '<img class="' + sq + '" loading="lazy" src="' + it.img + '" alt="">' : '<div class="noimg' + sq + '"></div>') +
                '<div class="body"><h2>' + esc(it.title) + '<span>' + (it.year || '') + ' · ' + it.kind + (it.score ? ' · ' + it.score : '') + '</span></h2>' +
                (why ? '<div class="why">Because you liked ' + esc(why) + '</div>' : '') +
                (it.where ? '<div class="where">' + it.wherePrefix + esc(it.where) + '</div>' : '') +
                '<p>' + esc(it.plot) + '</p>' +
                '<div class="act">' +
                '<button class="up' + (t === 1 ? ' on' : '') + '" data-rate="1">👍 Liked it</button>' +
                '<button class="down' + (t === -1 ? ' on' : '') + '" data-rate="-1">👎 Not for me</button>' +
                '<button data-like="1">More like this</button>' +
                '<button data-theme="' + it.theme + '">' + esc(themes[it.theme]) + '</button>' +
                '</div></div></div>';
        }

        function renderMore() {
            const slice = list.slice(shown, shown + PAGE);
            resultsEl.insertAdjacentHTML('beforeend', slice.map(itemHtml).join(''));
            shown += slice.length;
            moreEl.style.display = shown < list.length ? 'block' : 'none';
        }
        function showList(l, emptyMsg) {
            list = l; shown = 0; resultsEl.innerHTML = '';
            if (!l.length) { resultsEl.innerHTML = '<div class="msg">' + emptyMsg + '</div>'; moreEl.style.display = 'none'; return; }
            renderMore();
        }

        // ---- views ----
        function viewThemes() {
            whyFor = null;
            const likes = liked();
            const rows = themes.map((name, i) => {
                const all = items.filter(it => it.theme === i && pass(it));
                return {
                    i, name, n: all.length,
                    liked: likes.filter(it => it.theme === i).length,
                    ex: all.slice().sort((a, b) => b.pop - a.pop).slice(0, 5).map(it => it.title)
                };
            }).filter(r => r.n).sort((a, b) => b.liked - a.liked || b.n - a.n);
            const what = medium === 'books' ? 'Every blurb' : medium === 'music' ? 'Every album\'s notes and track list' : medium === 'games' ? 'Every game description' : 'Every plot';
            headEl.innerHTML = '<h1>' + rows.length + ' themes</h1><p class="hint">' + what + ' was read and grouped by what it is about. ' +
                'Pick a theme that sounds like your kind of thing' + (likes.length ? '; themes with your 👍 come first.' : '.') + '</p>';
            list = []; moreEl.style.display = 'none';
            resultsEl.innerHTML = rows.map(r =>
                '<button class="theme" data-theme="' + r.i + '"><b>' + esc(r.name) + '</b><span class="n">' + r.n + ' titles</span>' +
                (r.liked ? '<span class="liked">👍 ' + r.liked + '</span>' : '') +
                '<span class="ex">' + esc(r.ex.join(' · ')) + '</span></button>').join('');
            countEl.textContent = items.filter(pass).length.toLocaleString() + ' titles';
        }

        function viewTheme(i) {
            whyFor = null;
            const l = items.filter(it => it.theme === i && pass(it)).sort((a, b) => quality(b) - quality(a));
            headEl.innerHTML = '<h1>' + esc(themes[i] || '') + '</h1><p class="hint">' + M().bestFirst + '. 👍 the ones you already love and the "For me" tab gets smarter.</p>';
            countEl.textContent = l.length + ' titles';
            showList(l, 'Nothing here with these filters.');
        }

        function viewLike(key) {
            whyFor = null;
            const src = byKey[key];
            if (!src) return viewThemes();
            const l = items.filter(it => it !== src && pass(it))
                .map(it => [sim(src.row, it.row), it]).sort((a, b) => b[0] - a[0]).slice(0, 60).map(x => x[1]);
            headEl.innerHTML = '<h1>Closest to ' + esc(src.title) + '</h1><p class="hint">' + esc(src.plot) + '</p>';
            countEl.textContent = l.length + ' closest';
            showList(l, 'Nothing here with these filters.');
        }

        function recommend() {
            const likes = liked(), nos = disliked();
            whyFor = {};
            return items.filter(it => !taste[it.key] && pass(it)).map(it => {
                // score = how close this one is to the 3 liked titles nearest to it, minus anything close to a 👎
                const s = likes.map(l => [sim(l.row, it.row), l]).sort((a, b) => b[0] - a[0]);
                const top = s.slice(0, 3);
                let score = top.reduce((a, x) => a + x[0], 0) / top.length;
                let worst = 0;
                for (const n of nos) worst = Math.max(worst, sim(n.row, it.row));
                score -= 0.5 * worst;
                score += 0.02 * (quality(it) - 6.3);
                whyFor[it.key] = s[0][1].title;
                return [score, it];
            }).sort((a, b) => b[0] - a[0]).slice(0, 150).map(x => x[1]);
        }

        function viewMe(keepSearch) {
            const likes = liked(), nos = disliked();
            if (!keepSearch) {
                const noun = medium === 'books' ? 'books' : medium === 'music' ? 'albums' : medium === 'games' ? 'games' : 'titles';
                headEl.innerHTML = '<h1>For me</h1><p class="hint">Tell it a few ' + noun + ' you already love. It then ranks everything else by how close it is to the ones you liked ' +
                    '(and away from the ones you didn\'t). 5 to 10 likes already works well.</p>' +
                    '<input type="search" id="find" placeholder="Type a title you loved…" autocomplete="off">' +
                    '<div class="chips" id="chips"></div>';
                document.getElementById('find').addEventListener('input', () => viewMe(true));
            }
            document.getElementById('chips').innerHTML =
                likes.map(it => '<button class="chip up" data-unrate="' + it.key + '">👍 ' + esc(it.title) + ' ✕</button>').join('') +
                nos.map(it => '<button class="chip down" data-unrate="' + it.key + '">👎 ' + esc(it.title) + ' ✕</button>').join('');
            const q = document.getElementById('find').value.trim().toLowerCase();
            if (q) {
                whyFor = null;
                const l = items.filter(it => it.low.includes(q)).sort((a, b) => b.pop - a.pop).slice(0, 40);
                countEl.textContent = l.length + ' titles found';
                return showList(l, 'No title like that in the list.');
            }
            if (!likes.length) {
                whyFor = null;
                countEl.textContent = 'No likes yet';
                list = []; moreEl.style.display = 'none';
                resultsEl.innerHTML = '<div class="msg">Search a title above and tap 👍, or browse Themes and 👍 what you know.</div>';
                return;
            }
            const l = recommend();
            countEl.textContent = 'Top ' + l.length + ' from ' + likes.length + ' 👍' + (nos.length ? ' and ' + nos.length + ' 👎' : '');
            showList(l, 'Nothing left with these filters.');
        }

        // ---- routing: #books/me, #music/t=3, #like=movie:123 (no prefix = movies, so old links keep working) ----
        function parseHash() {
            let h = decodeURIComponent(location.hash.slice(1));
            let m = 'movies';
            const slash = h.indexOf('/');
            const head = slash === -1 ? h : h.slice(0, slash);
            if (MEDIA[head]) { m = head; h = slash === -1 ? '' : h.slice(slash + 1); }
            return { m, h };
        }
        function renderTypes() {
            document.getElementById('types').innerHTML =
                M().types.map(([v, l]) => '<button data-type="' + v + '"' + (v === type ? ' class="on"' : '') + '>' + l + '</button>').join('') +
                '<button id="good" title="' + esc(M().goodTitle) + '"' + (good ? ' class="on"' : '') + '>' + M().goodLabel + '</button>';
            document.querySelectorAll('#media button').forEach(b => b.classList.toggle('on', b.dataset.medium === medium));
        }
        async function route() {
            const { m, h } = parseHash();
            if (m !== medium || !loaded[m]) {
                if (m !== medium) { type = 'all'; }
                medium = m;
                renderTypes();
                countEl.textContent = 'Loading…';
                if (!loaded[m]) await load(m);
                if (!loaded[m]) return;
            }
            ({ items, byKey, themes, dim, vec } = loaded[medium]);
            renderTypes();
            document.getElementById('tab-themes').classList.toggle('on', h !== 'me');
            document.getElementById('tab-me').classList.toggle('on', h === 'me');
            document.getElementById('tab-me').textContent = 'For me' + (liked().length ? ' (' + liked().length + ' 👍)' : '');
            window.scrollTo(0, 0);
            if (h === 'me') viewMe();
            else if (h.startsWith('t=')) viewTheme(+h.slice(2));
            else if (h.startsWith('like=')) viewLike(h.slice(5));
            else viewThemes();
        }
        const go = h => { const full = (medium === 'movies' ? '' : medium + '/') + h; if (location.hash.slice(1) === full) route(); else location.hash = full; };
        window.addEventListener('hashchange', route);

        // ---- clicks ----
        document.addEventListener('click', e => {
            const b = e.target.closest('button');
            if (!b) return;
            if (b.dataset.medium) { location.hash = b.dataset.medium === 'movies' ? '' : b.dataset.medium; if (!location.hash && medium !== 'movies') route(); return; }
            if (b.dataset.go) return go(b.dataset.go);
            if (b.dataset.theme !== undefined) return go('t=' + b.dataset.theme);
            if (b.dataset.unrate) { delete taste[b.dataset.unrate]; saveTaste(); return route(); }
            if (b.id === 'good') { good = !good; b.classList.toggle('on', good); return route(); }
            if (b.dataset.type) {
                type = b.dataset.type;
                document.querySelectorAll('#types button[data-type]').forEach(x => x.classList.toggle('on', x === b));
                return route();
            }
            if (b.id === 'more') return renderMore();
            const card = b.closest('.item');
            if (!card) return;
            const key = card.dataset.key;
            if (b.dataset.like) return go('like=' + key);
            if (b.dataset.rate) {
                const r = +b.dataset.rate;
                if (taste[key] === r) delete taste[key]; else taste[key] = r;
                saveTaste();
                card.querySelector('.up').classList.toggle('on', taste[key] === 1);
                card.querySelector('.down').classList.toggle('on', taste[key] === -1);
                document.getElementById('tab-me').textContent = 'For me' + (liked().length ? ' (' + liked().length + ' 👍)' : '');
                const chips = document.getElementById('chips');
                if (chips) {   // on the For-me tab: clear the search and re-rank right away
                    const f = document.getElementById('find');
                    if (f.value) { f.value = ''; }
                    viewMe(true);
                }
            }
        });

        window.addEventListener('scroll', () => {
            if (shown < list.length && window.innerHeight + window.scrollY >= document.body.offsetHeight - 600) renderMore();
        });

        async function load(m) {
            const cfg = MEDIA[m];
            try {
                const [dr, tr] = await Promise.all([fetch(cfg.data), fetch(cfg.themes)]);
                if (!dr.ok || !tr.ok) throw new Error('HTTP ' + dr.status + '/' + tr.status);
                const data = await dr.json(), th = await tr.json();
                const raw = atob(th.vec), n = th.ids.length, d = th.dim;
                const v = new Float32Array(n * d);
                for (let r = 0; r < n; r++) {
                    let norm = 0;
                    for (let i = 0; i < d; i++) {
                        let x = raw.charCodeAt(r * d + i); if (x > 127) x -= 256;
                        v[r * d + i] = x; norm += x * x;
                    }
                    norm = Math.sqrt(norm) || 1;
                    for (let i = 0; i < d; i++) v[r * d + i] /= norm;
                }
                const rowOf = {};
                th.ids.forEach((k, r) => { rowOf[k] = r; });
                const its = [], bk = {};
                for (const it of cfg.parse(data)) {
                    const row = rowOf[it.key];
                    if (row === undefined || !it.plot) continue;   // newer than the last theme build
                    it.row = row; it.theme = th.theme[row]; it.low = (it.title + ' ' + (it.author || it.artist || it.developer || '')).toLowerCase();
                    its.push(it); bk[it.key] = it;
                }
                loaded[m] = { items: its, byKey: bk, themes: th.themes, dim: d, vec: v };
            } catch (error) {
                countEl.textContent = '';
                headEl.innerHTML = '';
                resultsEl.innerHTML = '<div class="msg">Could not load the ' + m + ' data (' + esc(String(error.message)) + ').' +
                    (m !== 'movies' ? ' The themes for this medium may not have been built yet.' : '') + '</div>';
            }
        }
        route();
    </script>
</body>
</html>
