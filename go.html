<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening Spotify…</title>
<body style="background:#111;color:#ccc;font:16px system-ui;text-align:center;padding-top:40vh">Opening Spotify…
<script>
// Spotify links from the cards pass through here. A tap on a spotify.com link makes iPad/iPhone hand it to the
// Spotify app, which ignores the search text; a redirect done by script stays in the browser, where the
// one-album search page works. Only open.spotify.com addresses are followed.
const u = decodeURIComponent(location.hash.slice(1));
if (u.startsWith('https://open.spotify.com/')) location.replace(u);
else document.body.textContent = 'Nothing to open.';
</script>
