                    <p style="margin: 8px 0 0; font-size: 12px; color: #ddd;"><strong>Tracks:</strong><br>${tracks}</p>`;
            }
            
            // Screenshot browser: ‹ › flip through RAWG's pictures (key art first, then gameplay)
            const shots = isGame ? (item.screenshots || []) : [];
            const shotNav = shots.length > 1 ? `
                <button class="shot-nav" data-dir="-1" title="Previous picture" style="position: absolute; left: 6px; top: 50%; transform: translateY(-50%); width: 34px; height: 44px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.35); background: rgba(0,0,0,0.55); color: #fff; font-size: 22px; line-height: 1; padding: 0; cursor: pointer;">‹</button>
                <button class="shot-nav" data-dir="1" title="Next picture" style="position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 34px; height: 44px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.35); background: rgba(0,0,0,0.55); color: #fff; font-size: 22px; line-height: 1; padding: 0; cursor: pointer;">›</button>
                <div class="shot-count" style="position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6); color: #fff; font-size: 12px; padding: 3px 8px; border-radius: 10px;">1 / ${shots.length}</div>` : '';
            const shotData = shots.length > 1 ? ` data-shots='${esc(JSON.stringify(shots))}' data-idx="0"` : '';
            
            // Games (key art has no lettering), albums and books (cover lettering is all over the place or missing) get the name printed on the card
            const captionSub = isGame ? `${item.year || ''}${item.developer ? ' · ' + esc(item.developer) : ''}` : isBook ? `${esc(item.author)}${item.year ? ' · ' + item.year : ''}` : `${esc(item.artist)}${item.year ? ' · ' + item.year : ''}`;
            const caption = (isGame || isBook || item.type === 'music') ? `<div class="game-caption" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 70px 14px 14px; transition: opacity 0.2s; background: linear-gradient(to top, rgba(0,0,0,0.92), rgba(0,0,0,0.55) 55%, transparent); color: #fff; pointer-events: none;"><div style="font-size: 19px; font-weight: 700; line-height: 1.2; text-shadow: 0 1px 3px rgba(0,0,0,0.9); padding-right: ${badge ? '120px' : '0'};">${esc(item.title)}</div><div style="font-size: 12px; color: #ccc; margin-top: 3px;">${captionSub}</div></div>` : '';
            return `
                <div class="movie-card"${shotData} style="position: relative; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); cursor: pointer; background: #000;">
                    ${cover}
                    ${shotNav}
                    ${caption}
                    ${badgeHTML}
                    <div class="card-overlay" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); color: white; padding: 20px; opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s; overflow-y: hidden; overscroll-behavior: contain; display: flex; flex-direction: column; justify-content: flex-start; pointer-events: none;">
                        <h3 style="margin: 0 0 12px 0; color: white; font-size: 18px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);">${esc(item.title)}</h3>
                        <p style="margin: 0 0 12px 0; color: #fff; line-height: 1.5; font-size: 13px; text-shadow: 1px 1px 3px rgba(0,0,0,0.8);">${esc(item.overview) || (isBook || isGame ? 'No description available.' : '')}</p>
                        <div style="color: #fff; font-size: 13px; line-height: 1.8; text-shadow: 1px 1px 3px rgba(0,0,0,0.8);">${details}${tasteButtons(item)}${searchLinks(item)}</div>
                    </div>
                </div>`;
        }
        
        // ---- Themes: one file per embedding space (movies+tv share themes.json), loaded on demand ----
        const THEME_FILE = { movies: 'themes.json', tv: 'themes.json', books: 'themes_books.json', games: 'themes_games.json' };   // music has subgenres instead
        const themeSpaces = {};            // file → { themes, rowOf, themeOf, vec, dim } or null when missing
        const itemKey = it => it.type + ':' + it.id;
        async function loadThemes(file) {
            if (file in themeSpaces) return themeSpaces[file];
            themeSpaces[file] = null;
            try {
                const r = await fetch(file);
                if (!r.ok) return null;
                const th = await r.json();
                const raw = atob(th.vec), n = th.ids.length, d = th.dim;
                const vec = new Float32Array(n * d);
                for (let row = 0; row < n; row++) {
                    let norm = 0;
                    for (let i = 0; i < d; i++) { let x = raw.charCodeAt(row * d + i); if (x > 127) x -= 256; vec[row * d + i] = x; norm += x * x; }
                    norm = Math.sqrt(norm) || 1;
                    for (let i = 0; i < d; i++) vec[row * d + i] /= norm;
                }
                const rowOf = {};
                th.ids.forEach((k, row) => { rowOf[k] = row; });
                themeSpaces[file] = { themes: th.themes, rowOf, themeOf: th.theme, vec, dim: d };
            } catch (e) { console.log('themes unavailable for', file, e); }
            return themeSpaces[file];
        }
        const curSpace = () => THEME_FILE[currentContentType] ? (themeSpaces[THEME_FILE[currentContentType]] || null) : null;
        const themeOfItem = (sp, it) => { if (!sp) return -1; const row = sp.rowOf[itemKey(it)]; return row === undefined ? -1 : sp.themeOf[row]; };
        function sim(sp, a, b) {
            let s = 0; const x = a * sp.dim, y = b * sp.dim;
            for (let i = 0; i < sp.dim; i++) s += sp.vec[x + i] * sp.vec[y + i];
            return s;
        }
        
        // ---- taste: 👍/👎, kept in this browser only; same keys as themes.html ----
        let taste = {};
        try { taste = JSON.parse(localStorage.getItem('taste') || '{}'); } catch (e) {}
        const saveTaste = () => { try { localStorage.setItem('taste', JSON.stringify(taste)); } catch (e) {} };
        const tasteButtons = it => {
            const k = itemKey(it), t = taste[k] || 0;
            return `<div class="taste" data-key="${k}"><button class="up${t === 1 ? ' on' : ''}" data-rate="1">👍 Liked it</button><button class="down${t === -1 ? ' on' : ''}" data-rate="-1">👎 Not for me</button></div>`;
        };
        // Google-search the title. On phones/tablets each chip hands the search to that browser app
        // (iOS URL schemes, Android intents); on a desktop every chip just opens the search in the current browser.
        const SEARCH_HINT = { movie: 'movie', tv: 'tv show', book: 'book', music: 'album', game: 'game' };
        const UA = navigator.userAgent;
        const IS_IOS = /iPhone|iPad|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const IS_ANDROID = /Android/.test(UA);
        function searchLinks(it) {
            const who = it.type === 'book' ? it.author : it.type === 'music' ? it.artist : '';
            const q = encodeURIComponent(`${it.title} ${who || ''} ${it.year || ''} ${SEARCH_HINT[it.type] || ''}`.replace(/\s+/g, ' ').trim());
            const g = `https://www.google.com/search?q=${q}`;
            const intent = pkg => `intent://www.google.com/search?q=${q}#Intent;scheme=https;package=${pkg};end`;
            const hrefs = IS_IOS ? { Brave: `brave://open-url?url=${encodeURIComponent(g)}`, Chrome: `googlechrome://www.google.com/search?q=${q}`, Edge: `microsoft-edge-https://www.google.com/search?q=${q}`, Safari: g }
                : IS_ANDROID ? { Brave: intent('com.brave.browser'), Chrome: intent('com.android.chrome'), Edge: intent('com.microsoft.emmx'), Safari: g }
                : { Brave: g, Chrome: g, Edge: g, Safari: g };
            const chip = (name, href) => `<a href="${href}" target="_blank" rel="noopener" title="Google this in ${name}" style="color: #9cc4ff; text-decoration: none; padding: 4px 10px; border: 1px solid #555; border-radius: 12px; font-size: 12px; background: rgba(0,0,0,0.35);">${name}</a>`;
            return `<div class="search-links" style="display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.15);">` +
                ['Brave', 'Chrome', 'Edge', 'Safari'].map(n => chip(n, hrefs[n])).join('') + '</div>';
        }
        
        document.addEventListener('click', e => {
            const b = e.target.closest('.taste button');
            if (!b) return;
            e.stopPropagation(); e.preventDefault();
            const k = b.parentElement.dataset.key, r = +b.dataset.rate;
            if (taste[k] === r) delete taste[k]; else taste[k] = r;
            saveTaste();
            document.querySelectorAll(`.taste[data-key="${k}"]`).forEach(box => {
                box.querySelector('.up').classList.toggle('on', taste[k] === 1);
                box.querySelector('.down').classList.toggle('on', taste[k] === -1);
            });
            populateThemeDropdown();      // the "Picks for me" option appears/updates
        }, true);
        
        // "Picks for me": closest to the 3 liked titles nearest to each candidate, pushed away from 👎 ones
        let whyFor = {};
        function picksForMe(items) {
            const sp = curSpace(); if (!sp) return items;
            const row = it => sp.rowOf[itemKey(it)];
            const likes = items.filter(it => taste[itemKey(it)] === 1 && row(it) !== undefined);
            const nos = items.filter(it => taste[itemKey(it)] === -1 && row(it) !== undefined);
            whyFor = {};
            if (!likes.length) return [];
            return items.filter(it => !taste[itemKey(it)] && row(it) !== undefined).map(it => {
                const s = likes.map(l => [sim(sp, row(l), row(it)), l]).sort((a, b) => b[0] - a[0]);
                const top = s.slice(0, 3);
                let score = top.reduce((a, x) => a + x[0], 0) / top.length;
                let worst = 0;
                for (const n of nos) worst = Math.max(worst, sim(sp, row(n), row(it)));
                score -= 0.5 * worst;
                whyFor[itemKey(it)] = s[0][1].title;
                return [score, it];
            }).sort((a, b) => b[0] - a[0]).slice(0, 150).map(x => x[1]);
        }
        
        let selectedTheme = '';           // '' | theme index (string) | 'forme'
        // Music: the second dropdown lists subgenres (MusicBrainz artist tags) within the chosen genre
        let selectedSubgenre = '';
        function populateSubgenreDropdown() {
            const sel = document.getElementById('themeFilter');
            const counts = {};
            for (const a of rawJsonData.music || []) {
                if (selectedGenre && !(a.genres || '').split(',').map(g => g.trim()).includes(selectedGenre)) continue;
                for (const sg of a.subgenres || []) counts[sg] = (counts[sg] || 0) + 1;
            }
            const prev = sel.value;
            sel.innerHTML = '<option value="">🎼 All Subgenres</option>';
            Object.entries(counts).sort((a, b) => b[1] - a[1]).forEach(([sg, n]) => {
                sel.insertAdjacentHTML('beforeend', `<option value="${esc(sg)}">${esc(sg)} (${n})</option>`);
            });
            sel.style.display = Object.keys(counts).length ? '' : 'none';
            sel.value = [...sel.options].some(o => o.value === prev) ? prev : '';
            if (sel.value !== selectedSubgenre) { selectedSubgenre = sel.value; applyFiltersAndDisplay(); }
        }
        
        async function populateThemeDropdown() {
            const sel = document.getElementById('themeFilter');
            if (!rawJsonData) return;
            if (currentContentType === 'music') { selectedTheme = ''; return populateSubgenreDropdown(); }
            const had = THEME_FILE[currentContentType] in themeSpaces;
            const sp = await loadThemes(THEME_FILE[currentContentType]);
            if (!had && sp) applyFiltersAndDisplay();          // first load of this space: show theme names on the items
            const items = rawJsonData[currentContentType] || [];
            const typeOf = { movies: 'movie', tv: 'tv', books: 'book', music: 'music', games: 'game' }[currentContentType];
            const counts = {}; let liked = 0;
            if (sp) for (const raw of items) {
                const it = { type: typeOf, id: raw.id };
                const t = themeOfItem(sp, it);
                if (t >= 0) counts[t] = (counts[t] || 0) + 1;
                if (taste[itemKey(it)] === 1 && t >= 0) liked++;
            }
            const prev = sel.value;
            sel.innerHTML = '<option value="">🧭 All Themes</option>';
            if (liked) sel.insertAdjacentHTML('beforeend', `<option value="forme">✨ Picks for me (${liked} 👍)</option>`);
            if (sp) Object.entries(counts).sort((a, b) => b[1] - a[1]).forEach(([t, n]) => {
                sel.insertAdjacentHTML('beforeend', `<option value="${t}">${esc(sp.themes[t])} (${n})</option>`);
            });
            sel.style.display = sp ? '' : 'none';
            sel.value = [...sel.options].some(o => o.value === prev) ? prev : '';
            if (sel.value !== selectedTheme) { selectedTheme = sel.value; applyFiltersAndDisplay(); }
        }
        document.getElementById('themeFilter').addEventListener('change', function() {
            if (currentContentType === 'music') selectedSubgenre = this.value; else selectedTheme = this.value;
            applyFiltersAndDisplay();
        });
        
        // ---- Description-only list: same items, same order, text instead of posters ----
        const DESC_PAGE = 150;
        let descList = [], descShown = 0;
        const KIND = { movie: '🎬 Movie', tv: '📺 Show', book: '📚 Book', music: '🎵 Album', game: '🎮 Game' };
        function highlight(text, term) {
            text = esc(text || '');
            if (!term) return text;
            const words = term.split(/\s+/).filter(w => w.length > 1).sort((a, b) => b.length - a.length).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
            if (!words.length) return text;
            return text.replace(new RegExp('(' + words.join('|') + ')', 'gi'), '<mark>$1</mark>');
        }
        function descItemHtml(it) {
            const term = document.getElementById('searchFilter').value.toLowerCase().trim();
            const by = it.type === 'book' ? 'by ' + it.author : it.type === 'music' ? it.artist : it.type === 'game' ? (it.developer || it.platforms || '') : (it.director || '');
            const score = it.type === 'music' ? (it.x ? '❤️ ' + (it.x >= 1000 ? Math.round(it.x / 1000) + 'k' : it.x) : '')
                        : it.type === 'book' ? (it.y ? '★ ' + it.y.toFixed(1) : '')
                        : it.type === 'game' ? (it.metacritic ? 'MC ' + it.metacritic : (it.rating ? '★ ' + it.rating.toFixed(1) : ''))
                        : (it.y ? '★ ' + it.y.toFixed(1) : '');
            const why = whyFor[itemKey(it)];
            const sp = curSpace(); const t = themeOfItem(sp, it);
            const tail = it.type === 'music' ? (it.subgenres && it.subgenres.length ? ' · ' + esc(it.subgenres.slice(0, 3).join(', ')) : '') : (t >= 0 ? ' · ' + esc(sp.themes[t]) : '');
            return `<div class="desc-item"><h2>${esc(it.title)}<span>${it.year || ''} · ${KIND[it.type]}${by ? ' · ' + esc(by) : ''}${score ? ' · ' + score : ''}${tail}</span></h2>` +
                (why ? `<div class="why">Because you liked ${esc(why)}</div>` : '') +
                (it.overview ? `<p>${highlight(it.overview, term)}</p>` : '') +
                (it.tracks && it.tracks.length ? `<p class="tracks">Tracks: ${highlight(it.tracks.join(' · '), term)}</p>` : '') +
                tasteButtons(it) + searchLinks(it) + '</div>';
        }
        function renderDescMore() {
            const container = document.getElementById('cardsContainer');
            const slice = descList.slice(descShown, descShown + DESC_PAGE);
            container.insertAdjacentHTML('beforeend', slice.map(descItemHtml).join(''));
            descShown += slice.length;
        }
        window.addEventListener('scroll', () => {
            if (descOnly && descShown < descList.length && window.innerHeight + window.scrollY >= document.body.offsetHeight - 800) renderDescMore();
        });
        function renderDescriptions(items) {
            const container = document.getElementById('cardsContainer');
            container.style.display = 'block';
            container.innerHTML = '';
            descList = items; descShown = 0;
            if (!items.length) { container.innerHTML = '<p style="text-align: center; padding: 40px; color: #666;">No items match your filters</p>'; return; }
            renderDescMore();
        }
        
        function displayCards(data) {
            // Scroll to top instantly when filter changes
            window.scrollTo(0, 0);
            
            const container = document.getElementById('cardsContainer');
            const itemCount = document.getElementById('itemCount');
            
            // Update count display
            const totalMovies = data.movies.length;
            const totalTV = data.tv.length;
            const totalBooks = (data.books || []).length;
            const totalMusic = (data.music || []).length;
            const totalGames = (data.games || []).length;
            const totalItems = totalMovies + totalTV + totalBooks + totalMusic + totalGames;
            
            const parts = [];
            if (totalMovies) parts.push(`${totalMovies} movie${totalMovies !== 1 ? 's' : ''}`);
            if (totalTV) parts.push(`${totalTV} TV show${totalTV !== 1 ? 's' : ''}`);
            if (totalBooks) parts.push(`${totalBooks} book${totalBooks !== 1 ? 's' : ''}`);
            if (totalMusic) parts.push(`${totalMusic} album${totalMusic !== 1 ? 's' : ''}`);
            if (totalGames) parts.push(`${totalGames} game${totalGames !== 1 ? 's' : ''}`);
            itemCount.textContent = totalItems === 0 ? 'No items match filters' : 'Showing ' + parts.join(' and ');
            
            // Get today's date for filtering
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            // Filter out future releases and combine
            let allItems = [...data.movies, ...data.tv, ...(data.books || []), ...(data.music || []), ...(data.games || [])]
                .filter(item => {
                    // Get the release date
                    const releaseDate = item.releaseDate || item.release_date || item.first_air_date;
                    if (!releaseDate || releaseDate === 'N/A') return true;
                    
                    // Filter out future releases
                    const itemDate = new Date(releaseDate);
                    return itemDate <= today;
                })
            
            // Apply sorting based on currentSortOrder
            if (currentSortOrder === 'rating') {
                // Sort by highest rating first
                allItems.sort((a, b) => {
                    if (b.y !== a.y) return b.y - a.y;
                    return b.x - a.x; // Tie-breaker: more reviews
                });
            } else if (currentSortOrder === 'reviews') {
                // Sort by most reviews first
                allItems.sort((a, b) => {
                    if (b.x !== a.x) return b.x - a.x;
                    return b.y - a.y; // Tie-breaker: higher rating
                });
            } else { // 'recent' - default
                // Sort by most recent first
                allItems.sort((a, b) => {
                    const dateA = a.releaseDate || a.release_date || a.first_air_date;
                    const dateB = b.releaseDate || b.release_date || b.first_air_date;
                    
                    if (dateA && dateB && dateA !== 'N/A' && dateB !== 'N/A') {
                        const timeA = new Date(dateA).getTime();
                        const timeB = new Date(dateB).getTime();
                        if (timeA !== timeB) return timeB - timeA;
                    }
                    
                    // Tie-breaker: higher rating
                    if (b.y !== a.y) return b.y - a.y;
                    return b.x - a.x;
                });
            }
            
            if (selectedTheme === 'forme') allItems = picksForMe(allItems); else whyFor = {};
            
            if (descOnly) return renderDescriptions(allItems);
            container.style.display = 'grid';
            
            if (allItems.length === 0) {
                container.innerHTML = '<p style="text-align: center; padding: 40px; color: #666;">No items match your filters</p>';
                return;
            }
            
            container.innerHTML = allItems.map(item => {
                if (item.type === 'book' || item.type === 'music' || item.type === 'game') return mediaCard(item);
                const posterUrl = item.poster_path 
                    ? `https://image.tmdb.org/t/p/w500${item.poster_path}`
                    : 'https://via.placeholder.com/300x450?text=No+Poster';
                
                // Format release date as mm-dd-yyyy
                let formattedDate = 'N/A';
                const dateValue = item.releaseDate || item.release_date || item.first_air_date;
                if (dateValue && dateValue !== 'N/A') {
                    try {
                        const [year, month, day] = dateValue.split('-');
                        if (year && month && day) {
                            formattedDate = `${month}-${day}-${year}`;
                        } else {
                            formattedDate = dateValue;
                        }
                    } catch (e) {
                        formattedDate = dateValue;
                    }
                }
                
                // Streaming info
                let streamingHTML = '';
                if (item.providers && item.providers.streaming && item.providers.streaming.length > 0) {
                    // Map provider names to brand colors
                    const getProviderColor = (name) => {
                        const colors = {
                            'Netflix': '#E50914',
                            'Amazon Prime Video': '#00A8E1',
                            'Prime Video': '#00A8E1',
                            'Disney Plus': '#113CCF',
                            'Disney+': '#113CCF',
                            'Hulu': '#1CE783',
                            'HBO Max': '#B721FF',
                            'Max': '#0026FF',
                            'Apple TV Plus': '#000000',
                            'Apple TV+': '#000000',
                            'Peacock': '#000000',

        // Load function that can be called on page load or button click
        async function loadData() {
            try {
                // Try to fetch the file (works on web servers like Netlify)
                const response = await fetch('data.json');
                if (response.ok) {
                    const loadedData = await response.json();
                    
                    // Books and music live in their own files; a missing file just leaves that list empty
                    const [booksRes, musicRes, gamesRes] = await Promise.allSettled([
                        fetch('books.json').then(r => r.ok ? r.json() : { books: [] }),
                        fetch('music.json').then(r => r.ok ? r.json() : { albums: [] }),
                        fetch('games.json').then(r => r.ok ? r.json() : { games: [] })
                    ]);
                    
                    // Transform data structure if needed (tv_shows → tv)
                    rawJsonData = {
                        movies: loadedData.movies || [],
                        tv: loadedData.tv_shows || loadedData.tv || [],
                        books: booksRes.status === 'fulfilled' ? (booksRes.value.books || []) : [],
                        music: musicRes.status === 'fulfilled' ? (musicRes.value.albums || []) : [],
                        games: gamesRes.status === 'fulfilled' ? (gamesRes.value.games || []) : []
                    };
                    
                    // Populate genre dropdown with unique genres
                    populateGenreDropdown();
                    
                    // Apply filters and display
                    applyFiltersAndDisplay();
                    populateThemeDropdown();
                } else {
                    throw new Error('File not found');
                }
            } catch (error) {
                // Fetch failed (probably file:// protocol or file not found)
                console.log('Auto-load failed:', error);
            }
        }

                }
                
                button.addEventListener('click', () => {
                    // Only switch if clicking a different button (can't deselect)
                    if (selectedContentType !== type.value) {
                        
                        
                        
                        // Deselect all buttons
                        container.querySelectorAll('button').forEach(btn => {
                            btn.style.background = 'transparent';
                            btn.style.borderColor = '#555';
                        });
                        
                        // Select this type
                        selectedContentType = type.value;
                        button.style.background = '#3b82f6';
                        button.style.borderColor = '#3b82f6';
                        
                        if (rawJsonData) applyFiltersAndDisplay();
                    }
                });
                
                button.addEventListener('mouseenter', () => {
                    if (selectedContentType !== type.value) {
                        button.style.borderColor = '#888';
                    }
                });
                
                button.addEventListener('mouseleave', () => {
                    if (selectedContentType !== type.value) {
                        button.style.borderColor = '#555';
                    }
                });
                
                container.appendChild(button);
            });
        }

        // Populate Region buttons
        function populateRegionButtons() {
            const container = document.getElementById('regionButtons');
            container.innerHTML = '';
            
            const regions = [
                { value: 'US', label: 'United States' },
                { value: 'International', label: 'International' }
            ];
            
            regions.forEach(region => {
                const button = document.createElement('button');
                button.textContent = region.label;
                button.dataset.region = region.value;
                
                // Style based on selection
                if (selectedRegion === region.value) {
                    button.style.cssText = 'padding: 6px 14px; background: #3b82f6; color: white; border: 1px solid #3b82f6; border-radius: 20px; cursor: pointer; font-size: 12px; transition: all 0.2s;';
                } else {
                    button.style.cssText = 'padding: 6px 14px; background: transparent; color: white; border: 1px solid #555; border-radius: 20px; cursor: pointer; font-size: 12px; transition: all 0.2s;';
                }
                
                button.addEventListener('click', () => {
                    
                    
                    
                    // Deselect all buttons
                    container.querySelectorAll('button').forEach(btn => {
                        btn.style.background = 'transparent';
                        btn.style.borderColor = '#555';
                    });
                    
                    // Toggle selection
                    if (selectedRegion === region.value) {
                        selectedRegion = null;  // Deselect - show all
                    } else {
                        selectedRegion = region.value;  // Select this region
                        button.style.background = '#3b82f6';
                        button.style.borderColor = '#3b82f6';
                    }
                    
                    if (rawJsonData) applyFiltersAndDisplay();
                });
                
                button.addEventListener('mouseenter', () => {
                    if (selectedRegion !== region.value) {
                        button.style.borderColor = '#888';
                    }
                });
                
                button.addEventListener('mouseleave', () => {
                    if (selectedRegion !== region.value) {
                        button.style.borderColor = '#555';
                    }
                });
                
                container.appendChild(button);
            });
        }

        // Populate genre buttons
        function populateGenreButtons() {
            const container = document.getElementById('genreButtons');
            const dropdown = document.getElementById('genreDropdown');
            container.innerHTML = '';
            dropdown.innerHTML = '<option value="">All Genres</option>'; // Reset dropdown
            
            // Get all unique genres from the data based on selected type
            const allGenres = new Set();
            if (rawJsonData) {
                if (selectedContentType === 'movie') {
                    rawJsonData.movies.forEach(m => {
                        if (m.genres) {
                            m.genres.split(',').forEach(g => allGenres.add(g.trim()));
                        }
                    });
                } else if (selectedContentType === 'tv') {
                    rawJsonData.tv_shows.forEach(tv => {
                        if (tv.genres) {
                            tv.genres.split(',').forEach(g => allGenres.add(g.trim()));
                        }
                    });
                }
            }
            
            // If current selected genre doesn't exist in new type, deselect (show all)
            if (selectedGenre && !allGenres.has(selectedGenre)) {
                selectedGenre = null;
            }
            
            // Sort genres alphabetically and create buttons (excluding Animation only)
            const sortedGenres = Array.from(allGenres).sort();
            sortedGenres.forEach(genre => {
                if (genre !== 'Animation') {
                    // Create button for desktop
                    const button = document.createElement('button');
                    button.textContent = genre;
                    
                    // Style button based on selection
                    if (genre === selectedGenre) {
                        button.style.cssText = 'padding: 6px 14px; background: #3b82f6; color: white; border: 1px solid #3b82f6; border-radius: 20px; cursor: pointer; font-size: 12px; transition: all 0.2s;';
                    } else {
                        button.style.cssText = 'padding: 6px 14px; background: transparent; color: white; border: 1px solid #555; border-radius: 20px; cursor: pointer; font-size: 12px; transition: all 0.2s;';
                    }
                    button.dataset.genre = genre;
                    
                    button.addEventListener('click', () => {
                        
                        
                        
                        // Deselect all other buttons
                        container.querySelectorAll('button').forEach(btn => {
                            btn.style.background = 'transparent';
                            btn.style.borderColor = '#555';
                        });
                        
                        // Toggle selection
                        if (selectedGenre === genre) {
                            selectedGenre = null;  // Deselect - show all genres
                            dropdown.value = ''; // Sync dropdown
                        } else {
                            selectedGenre = genre;  // Select this genre
                            button.style.background = '#3b82f6';
                            button.style.borderColor = '#3b82f6';
                            dropdown.value = genre; // Sync dropdown
                        }
                        
                        if (rawJsonData) applyFiltersAndDisplay();
                    });
                    
                    button.addEventListener('mouseenter', () => {
                        if (selectedGenre !== genre) {
                            button.style.borderColor = '#888';
                        }
                    });
                    
                    button.addEventListener('mouseleave', () => {
                        if (selectedGenre !== genre) {
                            button.style.borderColor = '#555';
                        }
                    });
                    
                    container.appendChild(button);
                    
                    // Also add to dropdown for mobile
                    const option = document.createElement('option');
                    option.value = genre;
                    option.textContent = genre;
                    if (selectedGenre === genre) {
                        option.selected = true;
                    }
                    dropdown.appendChild(option);
                }
            });
        }
        
        // Genre dropdown change handler (for mobile)

        // Handle file selection
        document.getElementById('jsonFile').addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            try {
                const text = await file.text();
                rawJsonData = JSON.parse(text);
                
                // Populate genre buttons
                populateGenreButtons();
                
                // Apply filters and display
                applyFiltersAndDisplay();
            } catch (error) {
                console.error('Load error:', error);
                alert(`Failed to load data: ${error.message}\n\nMake sure you selected a valid JSON file.`);
            }
        });

        function applyFiltersAndDisplay() {
            if (!rawJsonData) return;
            
            // Filter movies by year range
            const filteredMovies = rawJsonData.movies
                .filter(movie => {
                    if (!movie.year || movie.year === 'N/A') return true;
                    return movie.year >= minYear && movie.year <= maxYear;
                })
                .map(movie => ({
                    id: movie.id,
                    title: movie.title,
                    x: movie.vote_count,
                    y: movie.vote_average,
                    year: movie.year,
                    genres: movie.genres,
                    overview: movie.overview,
                    director: movie.director,
                    actors: movie.actors,
                    releaseDate: movie.release_date,
                    type: 'movie',
                    poster_path: movie.poster_path,
                    providers: movie.providers
                }));
            
            // Filter TV shows by year range
            const filteredTv = rawJsonData.tv
                .filter(show => {
                    if (!show.year || show.year === 'N/A') return true;
                    return show.year >= minYear && show.year <= maxYear;
                })
                .map(show => ({
                    id: show.id,
                    title: show.title,
                    x: show.vote_count,
                    y: show.vote_average,
                    year: show.year,
                    genres: show.genres,
                    overview: show.overview,
                    actors: show.actors,
                    creator: show.creator,
                    releaseDate: show.first_air_date,
                    type: 'tv',
                    poster_path: show.poster_path,
                    tv_status: show.tv_status,
                    providers: show.providers
                }));
            
            const inYears = item => !item.year || item.year === 'N/A' || (item.year >= minYear && item.year <= maxYear);
            const filteredBooks = (rawJsonData.books || []).filter(inYears).map(b => ({
                id: b.id,
                title: b.title,
                author: b.author,
                x: b.readers,                 // "most reviewed" = most readers
                y: b.rating,                  // 0–5 stars
                ratings_count: b.ratings_count,
                year: b.year,
                genres: b.genres,
                overview: b.overview,
                releaseDate: b.release_date,
                type: 'book',
                subtype: b.type,              // fiction | nonfiction
                poster: b.cover_id ? `https://covers.openlibrary.org/b/id/${b.cover_id}-L.jpg` : null,
                pages: b.pages,
                ebook: b.ebook,
                ia: b.ia
            }));
            const filteredMusic = (rawJsonData.music || []).filter(inYears).map(a => ({
                id: a.id,
                title: a.title,
                artist: a.artist,
                x: a.fans,                    // "most reviewed" = most fans
                y: null,                      // Deezer has no ratings
                year: a.year,
                genres: a.genres,
                subgenres: a.subgenres || [],
                overview: a.overview,
                releaseDate: a.release_date,
                type: 'music',
                subtype: a.type,              // album | ep
                poster: a.cover,
                tracks: a.tracks,
                label: a.label,
                nb_tracks: a.nb_tracks,
                duration: a.duration,
                explicit: a.explicit,
                preview: a.preview,
                link: a.link
            }));
            
            const filteredGames = (rawJsonData.games || []).filter(inYears).map(g => ({
                id: g.id,
                slug: g.slug,
                title: g.title,
                x: g.added,                   // "most reviewed" = most players (RAWG library adds)
                y: g.metacritic ? g.metacritic / 10 : (g.rating ? g.rating * 2 : 0),   // 0–10 for sorting
                rating: g.rating,
                ratings_count: g.ratings_count,
                metacritic: g.metacritic,
                year: g.year,
                genres: g.genres,
                overview: g.overview,
                releaseDate: g.release_date,
                type: 'game',
                subtype: g.family,            // pc | playstation | xbox | nintendo | other
                poster: g.image,
                screenshots: g.screenshots || [],
                platforms: g.platforms,
                developer: g.developer,
                publisher: g.publisher,
                playtime: g.playtime,
                esrb: g.esrb,
                stores: g.stores
            }));
            
            allLoadedData = { movies: filteredMovies, tv: filteredTv, books: filteredBooks, music: filteredMusic, games: filteredGames };
            
            // Check if there's an active search term and reapply it
            const searchTerm = document.getElementById('searchFilter').value.toLowerCase().trim();
            let displayData = allLoadedData;
            
            if (searchTerm) {
                // Filter movies with search term
                const searchedMovies = allLoadedData.movies.filter(item => {
                    // Exclude Animation
                    if (item.genres && (item.genres.includes('Animation'))) return false;
                    
                    // Check if any streaming provider matches
                    let hasStreamingMatch = false;
                    if (item.providers && item.providers.streaming) {
                        hasStreamingMatch = item.providers.streaming.some(p => 
                            p.name && p.name.toLowerCase().includes(searchTerm)
                        );
                    }
                    
                    return (
                        (item.title && item.title.toLowerCase().includes(searchTerm)) ||
                        (item.overview && item.overview.toLowerCase().includes(searchTerm)) ||
                        (item.genres && item.genres.toLowerCase().includes(searchTerm)) ||
                        (item.director && item.director.toLowerCase().includes(searchTerm)) ||
                        (item.actors && item.actors.toLowerCase().includes(searchTerm)) ||
                        (item.year && item.year.toString().includes(searchTerm)) ||
                        hasStreamingMatch
                    );
                });
                
                // Filter TV shows with search term
                const searchedTv = allLoadedData.tv.filter(item => {
                    // Exclude Animation
                    if (item.genres && (item.genres.includes('Animation'))) return false;
                    
                    // Check if any streaming provider matches
                    let hasStreamingMatch = false;
                    if (item.providers && item.providers.streaming) {
                        hasStreamingMatch = item.providers.streaming.some(p => 
                            p.name && p.name.toLowerCase().includes(searchTerm)
                        );
                    }
                    
                    return (
                        (item.title && item.title.toLowerCase().includes(searchTerm)) ||
                        (item.overview && item.overview.toLowerCase().includes(searchTerm)) ||
                        (item.genres && item.genres.toLowerCase().includes(searchTerm)) ||
                        (item.actors && item.actors.toLowerCase().includes(searchTerm)) ||
                        (item.year && item.year.toString().includes(searchTerm)) ||
                        hasStreamingMatch
                    );
                });
                
                // Books: title, author, blurb, genres, year. Music: title, artist, notes, genres, label, track names, year.
                const hit = (...fields) => fields.some(f => f && String(f).toLowerCase().includes(searchTerm));
                const searchedBooks = allLoadedData.books.filter(item => hit(item.title, item.author, item.overview, item.genres, item.year));
                const searchedMusic = allLoadedData.music.filter(item => hit(item.title, item.artist, item.overview, item.genres, item.label, (item.tracks || []).join(' | '), item.year));
                const searchedGames = allLoadedData.games.filter(item => hit(item.title, item.developer, item.publisher, item.overview, item.genres, item.platforms, item.year));
                
                displayData = { movies: searchedMovies, tv: searchedTv, books: searchedBooks, music: searchedMusic, games: searchedGames };
            }
            
            // Filter by genre if selected
            if (selectedGenre) {
                const hasGenre = item => item.genres && item.genres.split(',').map(g => g.trim()).includes(selectedGenre);
                displayData = {
                    movies: displayData.movies.filter(hasGenre),
                    tv: displayData.tv.filter(hasGenre),
                    books: displayData.books.filter(hasGenre),
                    music: displayData.music.filter(hasGenre),
                    games: displayData.games.filter(hasGenre)
                };
            }
            
            // Music: filter by subgenre (depends on the genre pick)
            if (currentContentType === 'music' && selectedSubgenre) {
                displayData.music = displayData.music.filter(a => (a.subgenres || []).includes(selectedSubgenre));
            }
            
            // Filter by theme (a number = that theme; 'forme' is ranked later in displayCards)
            if (selectedTheme !== '' && selectedTheme !== 'forme') {
                const sp = curSpace(), want = +selectedTheme;
                const inTheme = it => themeOfItem(sp, it) === want;
                displayData = {
                    movies: displayData.movies.filter(inTheme), tv: displayData.tv.filter(inTheme),
                    books: displayData.books.filter(inTheme), music: displayData.music.filter(inTheme), games: displayData.games.filter(inTheme)
                };
            }
            
            // Filter by content type (movies, tv, books or music)
            displayData = {
                movies: currentContentType === 'movies' ? displayData.movies : [],
                tv: currentContentType === 'tv' ? displayData.tv : [],
                books: currentContentType === 'books' ? displayData.books : [],
                music: currentContentType === 'music' ? displayData.music : [],
                games: currentContentType === 'games' ? displayData.games : []
            };
            
            // Display
            displayCards(displayData);
        }


        // Search filter functionality - filters already loaded data
        let searchTimeout;
        document.getElementById('searchFilter').addEventListener('input', function() {
            // Clear previous timeout
            clearTimeout(searchTimeout);
            
            const searchValue = this.value.trim();
            
            // If empty, filter immediately to show all results
            if (searchValue.length === 0) {
                requestAnimationFrame(() => applyFiltersAndDisplay());
                return;
            }
            
            // If 1 character, don't do anything - wait for more input
            if (searchValue.length === 1) {
                return;
            }
            
            // For 2+ characters, wait 800ms after user stops typing (increased for iPad)
            searchTimeout = setTimeout(() => {
                // Use requestAnimationFrame to avoid blocking the UI
                requestAnimationFrame(() => applyFiltersAndDisplay());
            }, 800);
        });

        // Sort order radio button functionality
        document.querySelectorAll('input[name="sortOrder"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                currentSortOrder = e.target.value;
                
                // Update label styling
                document.querySelectorAll('input[name="sortOrder"]').forEach(r => {
                    const label = r.closest('label');
                    if (r.checked) {
                        label.style.background = '#3b82f6';
                        label.style.borderColor = '#3b82f6';
                    } else {
                        label.style.background = '#2a2a2a';
                        label.style.borderColor = '#555';
                    }
                });
                
                // Re-display with new sort order
                applyFiltersAndDisplay();
            });
        });
        
        // Content type radio button functionality
        document.querySelectorAll('input[name="contentType"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                currentContentType = e.target.value;
                
                // Update label styling
                document.querySelectorAll('input[name="contentType"]').forEach(r => {
                    const label = r.closest('label');
                    if (r.checked) {
                        label.style.background = '#3b82f6';
                        label.style.borderColor = '#3b82f6';
                    } else {
                        label.style.background = '#2a2a2a';
                        label.style.borderColor = '#555';
                    }
                });
                
                // Repopulate genre dropdown with genres for selected content type
                populateGenreDropdown();
                updateSortLabels();
                
                // Re-display with new content type filter
                applyFiltersAndDisplay();
                populateThemeDropdown();
            });
        });
        
        // Initialize selected content type button styling
        document.querySelectorAll('input[name="contentType"]').forEach(r => {
            const label = r.closest('label');
            label.style.background = r.checked ? '#3b82f6' : '#2a2a2a';
            label.style.borderColor = r.checked ? '#3b82f6' : '#555';
        });
        updateSortLabels();
        
        // The second and third sort pills mean different things per medium
        function updateSortLabels() {
            const countLabel = document.getElementById('sortCountLabel');
            const ratingLabel = document.getElementById('sortRatingLabel');
            const labels = {
                movies: '💬 Most Reviewed', tv: '💬 Most Reviewed',
                books: '👥 Most Readers', music: '❤️ Most Fans', games: '👥 Most Players'
            };
            countLabel.textContent = labels[currentContentType] || '💬 Most Reviewed';
            // Deezer has no ratings, so "Highest Rated" makes no sense for music
            const noRating = currentContentType === 'music';
            ratingLabel.style.display = noRating ? 'none' : 'flex';
            if (noRating && currentSortOrder === 'rating') {
                const recent = document.querySelector('input[name="sortOrder"][value="recent"]');
                recent.checked = true;
                recent.dispatchEvent(new Event('change'));
            }
        }
        
        // Populate genre dropdown based on current content type
        function populateGenreDropdown() {
            if (!rawJsonData) return;
            
            const genreSet = new Set();
            
            // Collect genres only from the currently selected content type
            const dataSource = rawJsonData[currentContentType] || [];
            
            dataSource.forEach(item => {
                if (item.genres && item.genres !== 'N/A') {
                    item.genres.split(',').forEach(genre => {
                        genreSet.add(genre.trim());
                    });
                }
            });
            
            // Sort genres alphabetically
            const sortedGenres = Array.from(genreSet).sort();
            
            // Populate dropdown
            const genreFilter = document.getElementById('genreFilter');
            const currentValue = genreFilter.value; // Remember current selection
            genreFilter.innerHTML = '<option value="">🎭 All Genres</option>';
            
            sortedGenres.forEach(genre => {
                const option = document.createElement('option');
                option.value = genre;
                option.textContent = genre;
                genreFilter.appendChild(option);
            });
            
            // Try to restore previous selection if it exists in new list
            if (currentValue && sortedGenres.includes(currentValue)) {
                genreFilter.value = currentValue;
            } else {
                genreFilter.value = '';
                selectedGenre = '';
            }
        }
        
        // Genre filter change handler
        document.getElementById('genreFilter').addEventListener('change', function() {
            selectedGenre = this.value;
            applyFiltersAndDisplay();
            if (currentContentType === 'music') populateSubgenreDropdown();
        });
        
        // Initialize selected radio button styling
        document.querySelectorAll('input[name="sortOrder"]').forEach(r => {
            const label = r.closest('label');
            if (r.checked) {
                label.style.background = '#3b82f6';
                label.style.borderColor = '#3b82f6';
            }
        });
        
        // Year range: every year back to 1990, then decades and centuries (books go back to antiquity)
        const EARLIEST = -3000;
        let minYear = EARLIEST;
        let maxYear = new Date().getFullYear();
        
        const minYearDropdown = document.getElementById('minYearDropdown');
        const maxYearDropdown = document.getElementById('maxYearDropdown');
        
        const currentYear = new Date().getFullYear();
        const yearSteps = [];
        for (let y = currentYear; y >= 1990; y--) yearSteps.push([y, String(y)]);
        for (let y = 1980; y >= 1900; y -= 10) yearSteps.push([y, y + 's']);
        for (const [y, l] of [[1800, '1800s'], [1700, '1700s'], [1600, '1600s'], [1500, '1500s'], [1, 'Year 1+'], [EARLIEST, 'Any year']]) yearSteps.push([y, l]);
        for (const [y, label] of yearSteps) {
            const minOption = document.createElement('option');
            minOption.value = y;
            minOption.textContent = label;
            if (y === EARLIEST) minOption.selected = true;
            minYearDropdown.appendChild(minOption);
            
            const maxOption = document.createElement('option');
            maxOption.value = y;
            maxOption.textContent = label;
            if (y === currentYear) maxOption.selected = true;
            maxYearDropdown.appendChild(maxOption);
        }
        
        // Handle min year change
        minYearDropdown.addEventListener('change', function() {
            minYear = parseInt(this.value);
            // If min > max, adjust max
            if (minYear > maxYear) {
                maxYear = minYear;
                maxYearDropdown.value = minYear;
            }
            applyFiltersAndDisplay();
        });
        
        // Handle max year change
        maxYearDropdown.addEventListener('change', function() {
            maxYear = parseInt(this.value);
            // If max < min, adjust min
            if (maxYear < minYear) {
                minYear = maxYear;
                minYearDropdown.value = maxYear;
            }
            applyFiltersAndDisplay();
        });
        
        // Function to download table as CSV
        function downloadTableAsCSV() {
            if (!allLoadedData || (!allLoadedData.movies.length && !allLoadedData.tv.length)) {
                alert('No data to download. Please load data first.');
                return;
            }

            // Combine all items
            const allItems = [...allLoadedData.movies, ...allLoadedData.tv].sort((a, b) => {
                if (b.y !== a.y) return b.y - a.y;
                return b.x - a.x;
            });

            // CSV header
            let csv = ['Title,Year,Rating,Reviews,Director,Main Actors,Overview'];
            
            // Add rows
            allItems.forEach(item => {
                const row = [
                    `"${(item.title || '').replace(/"/g, '""')}"`,
                    item.year || '',
                    item.y.toFixed(1),
                    item.x,
                    `"${(item.director || 'N/A').replace(/"/g, '""')}"`,
                    `"${(item.actors || 'N/A').replace(/"/g, '""')}"`,
                    `"${(item.overview || '').replace(/"/g, '""')}"`
                ];
                csv.push(row.join(','));
            });
            
            const csvContent = csv.join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            
            link.setAttribute('href', url);
            link.setAttribute('download', 'tmdb_data.csv');
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        
    </script>
